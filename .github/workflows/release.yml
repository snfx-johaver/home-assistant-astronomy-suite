name: Auto Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version bump from commits
        id: bump
        run: python scripts/release_decision.py

      - name: Bump version
        if: steps.bump.outputs.skip != 'true'
        id: version
        run: |
          python scripts/bump_version.py ${{ steps.bump.outputs.bump }}

          # Read new version
          NEW_VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push version bump
        if: steps.bump.outputs.skip != 'true'
        run: |
          git add -A
          git commit --amend -m "release: v${{ steps.version.outputs.version }} [skip ci]"
          git tag -f "v${{ steps.version.outputs.version }}"
          git push --force-with-lease
          git push --tags --force

      - name: Create GitHub Release
        if: steps.bump.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## What's Changed

            ${{ steps.bump.outputs.changelog }}

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.bump.outputs.previous_tag }}...${{ steps.version.outputs.tag }}
          generate_release_notes: false
