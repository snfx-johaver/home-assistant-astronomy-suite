            show_header_toggle: false
            entities:
              - sensor.astronomy_space_suite_neo_count_today
              - sensor.astronomy_space_suite_closest_neo
              - sensor.astronomy_space_suite_fastest_neo
              - sensor.astronomy_space_suite_largest_neo

