              - sensor.astronomy_space_suite_largest_neo
              - sensor.astronomy_space_suite_coronal_mass_ejections
              - sensor.astronomy_space_suite_solar_flares
              - sensor.astronomy_space_suite_geomagnetic_storms
              - sensor.astronomy_space_suite_active_earth_events
              - sensor.astronomy_space_suite_tech_transfer_patents
              - sensor.astronomy_space_suite_rocket_launch_1
              - sensor.astronomy_space_suite_rocket_launch_2
              - sensor.astronomy_space_suite_rocket_launch_3
              - sensor.astronomy_space_suite_rocket_launch_4
              - sensor.astronomy_space_suite_rocket_launch_5
              - sensor.astronomy_space_suite_iss_position
              - sensor.astronomy_space_suite_planetary_kp_index
