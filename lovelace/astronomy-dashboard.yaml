# ================================================================
# �� Astronomy Space Suite Dashboard
# ================================================================
# This dashboard is automatically available after installing the
# integration. No manual setup required.
#
# Optional: Add as a YAML dashboard in configuration.yaml:
#   lovelace:
#     dashboards:
#       astronomy:
#         mode: yaml
#         title: "🔭 Astronomy"
#         icon: mdi:telescope
#         show_in_sidebar: true
#         filename: lovelace/astronomy-dashboard.yaml
# ================================================================

title: "🔭 Astronomy Space Suite"
views:

  # ═══════════════════════════════════════════════════════════════
  # VIEW 1: Overview — The hero view
  # ═══════════════════════════════════════════════════════════════
  - title: Overview
    path: overview
    icon: mdi:telescope
    cards:
      # Row 1: APOD full-width
      - type: custom:apod-card
        entity: sensor.nasa_astronomy_suite_apod
        show_explanation: true
        show_copyright: true

      # Row 2: Quick stats
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_neo_count_today
            name: NEOs Today
            icon: mdi:meteor
            icon_color: blue
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_planetary_kp_index
            name: KP Index
            icon: mdi:aurora
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_coronal_mass_ejections
            name: CMEs (7d)
            icon: mdi:white-balance-sunny
            icon_color: orange
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_solar_flares
            name: Flares (7d)
            icon: mdi:flare
            icon_color: yellow

      # Row 3: Solar System + Rocket Launches side by side
      - type: horizontal-stack
        cards:
          - type: custom:solar-system-card
            title: Solar System
            show_jupiter: true
            show_saturn: true
          - type: custom:rocket-launch-card
            entity_prefix: sensor.nasa_astronomy_suite_rocket_launch
            max_launches: 5
            title: Upcoming Launches

  # ═══════════════════════════════════════════════════════════════
  # VIEW 2: Space Weather — Solar activity & aurora
  # ═══════════════════════════════════════════════════════════════
  - title: Space Weather
    path: space-weather
    icon: mdi:weather-sunny-alert
    cards:
      # Solar Activity Card with KP gauge + Sun cameras
      - type: custom:solar-activity-card
        title: Solar Activity Monitor
        cme_entity: sensor.nasa_astronomy_suite_coronal_mass_ejections
        flare_entity: sensor.nasa_astronomy_suite_solar_flares
        storm_entity: sensor.nasa_astronomy_suite_geomagnetic_storms
        kp_entity: sensor.nasa_astronomy_suite_planetary_kp_index
        sdo_entity: camera.nasa_astronomy_suite_sdo_sun
        soho_entity: camera.nasa_astronomy_suite_soho_sun

      # KP Index detail
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_planetary_kp_index
            name: Planetary KP Index
            icon: mdi:aurora
            icon_color: green
            layout: vertical
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_geomagnetic_storms
            name: Geomagnetic Storms
            icon: mdi:weather-lightning
            icon_color: purple
            layout: vertical

      # Sun cameras side by side
      - type: horizontal-stack
        cards:
          - type: picture-entity
            entity: camera.nasa_astronomy_suite_sdo_sun
            name: "☀️ SDO Corona (171Å)"
            show_state: false
            show_name: true
            camera_view: live
          - type: picture-entity
            entity: camera.nasa_astronomy_suite_soho_sun
            name: "☀️ SOHO Coronagraph"
            show_state: false
            show_name: true
            camera_view: live

  # ═══════════════════════════════════════════════════════════════
  # VIEW 3: NEO Tracker — Near Earth Objects
  # ═══════════════════════════════════════════════════════════════
  - title: NEO Tracker
    path: neo-tracker
    icon: mdi:meteor
    cards:
      - type: custom:neo-threat-card
        entity: sensor.nasa_astronomy_suite_neo_count_today
        max_items: 10
        title: Near Earth Objects

      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_closest_neo
            name: Closest
            icon: mdi:bullseye-arrow
            icon_color: red
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_fastest_neo
            name: Fastest
            icon: mdi:speedometer
            icon_color: orange
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_largest_neo
            name: Largest
            icon: mdi:resize
            icon_color: blue

  # ═══════════════════════════════════════════════════════════════
  # VIEW 4: ISS — Tracker & Live Stream
  # ═══════════════════════════════════════════════════════════════
  - title: ISS
    path: iss
    icon: mdi:space-station
    cards:
      - type: custom:iss-tracker-card
        entity: sensor.nasa_astronomy_suite_iss_position
        title: International Space Station
        show_map: true
        show_trail: true
        show_stream_button: true

      - type: custom:mushroom-entity-card
        entity: sensor.nasa_astronomy_suite_iss_position
        name: ISS Position
        icon: mdi:space-station
        icon_color: red

  # ═══════════════════════════════════════════════════════════════
  # VIEW 5: Earth — Satellite imagery
  # ═══════════════════════════════════════════════════════════════
  - title: Earth
    path: earth
    icon: mdi:earth
    cards:
      # Multi-source observation card
      - type: custom:earth-observation-card
        title: Earth & Sun Observation
        epic_entity: camera.nasa_astronomy_suite_epic_earth
        goes_entity: camera.nasa_astronomy_suite_goes_16_earth
        goes18_entity: camera.nasa_astronomy_suite_goes_18_earth
        himawari_entity: camera.nasa_astronomy_suite_himawari_8_earth
        sdo_entity: camera.nasa_astronomy_suite_sdo_sun
        soho_entity: camera.nasa_astronomy_suite_soho_sun

      # Individual camera cards
      - type: horizontal-stack
        cards:
          - type: picture-entity
            entity: camera.nasa_astronomy_suite_epic_earth
            name: "🌍 NASA EPIC"
            show_state: false
            show_name: true
            camera_view: live
          - type: picture-entity
            entity: camera.nasa_astronomy_suite_goes_16_earth
            name: "🌎 GOES-16 (Americas)"
            show_state: false
            show_name: true
            camera_view: live

      - type: horizontal-stack
        cards:
          - type: picture-entity
            entity: camera.nasa_astronomy_suite_goes_18_earth
            name: "🌏 GOES-18 (Pacific)"
            show_state: false
            show_name: true
            camera_view: live
          - type: picture-entity
            entity: camera.nasa_astronomy_suite_himawari_8_earth
            name: "🌏 Himawari-8 (Asia)"
            show_state: false
            show_name: true
            camera_view: live

      # Earth events
      - type: custom:mushroom-entity-card
        entity: sensor.nasa_astronomy_suite_active_earth_events
        name: Active Earth Events (EONET)
        icon: mdi:earth-alert
        icon_color: red

  # ═══════════════════════════════════════════════════════════════
  # VIEW 6: Solar System — Orrery & Horizon
  # ═══════════════════════════════════════════════════════════════
  - title: Solar System
    path: solar-system
    icon: mdi:orbit
    cards:
      - type: custom:solar-system-card
        title: Solar System Orrery
        show_jupiter: true
        show_saturn: true

      - type: horizontal-stack
        cards:
          - type: custom:astro-horizon-card
            entity: sun.sun
            title: Sun Arc
          - type: custom:astro-lunar-card
            entity: sensor.moon
            title: Moon Phase

  # ═══════════════════════════════════════════════════════════════
  # VIEW 7: Launches — Rocket launches
  # ═══════════════════════════════════════════════════════════════
  - title: Launches
    path: launches
    icon: mdi:rocket-launch
    cards:
      - type: custom:rocket-launch-card
        entity_prefix: sensor.nasa_astronomy_suite_rocket_launch
        max_launches: 5

  # ═══════════════════════════════════════════════════════════════
  # VIEW 8: Deep-Sky — Telescope targets (deep-sky objects feature)
  # ═══════════════════════════════════════════════════════════════
  # These cards read the locally computed deep-sky sensors. They are
  # enabled by default; toggle the feature in the integration options.
  - title: Deep-Sky
    path: deep-sky
    icon: mdi:star-shooting
    cards:
      - type: custom:deepsky-tonight-card
        entity: sensor.nasa_astronomy_deepsky_best_tonight
        title: "🔭 Tonight's Best Targets"

      - type: custom:deepsky-dome-card
        entity: sensor.nasa_astronomy_deepsky_best_tonight
        title: Sky Dome — drag to look around
        height: 360

      - type: custom:deepsky-yardmap-card
        entity: sensor.nasa_astronomy_deepsky_best_tonight
        title: Sky Map

      - type: custom:deepsky-panorama-card
        entity: sensor.nasa_astronomy_deepsky_best_tonight
        title: Horizon Panorama
        title: Upcoming Rocket Launches

      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_rocket_launch_1
            name: Next Launch
            icon: mdi:rocket-launch
            icon_color: deep-purple
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_rocket_launch_2
            name: Launch #2
            icon: mdi:rocket
            icon_color: indigo
          - type: custom:mushroom-entity-card
            entity: sensor.nasa_astronomy_suite_rocket_launch_3
            name: Launch #3
            icon: mdi:rocket
            icon_color: blue
