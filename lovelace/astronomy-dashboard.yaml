# Astronomy Space Suite - comprehensive example dashboard
#
# Import this file as a separate YAML dashboard. The integration deploys and
# registers astronomy-cards.js and deepsky-cards.js automatically.
#
# Optional integrations:
#   - Home Assistant Sun (`sun.sun`) for the Horizon card
#   - Home Assistant Moon (`sensor.moon_phase`) for the Lunar card
#
# Ephemeris bodies and deep-sky objects can be disabled in integration options.
# Their standard entity rows will then show unavailable without invalidating the
# dashboard; custom cards already hide data that is not present.
#
# Current card appearance remains the default. Set glass_mode: true on an
# individual Astronomy Space Suite card to opt in to its isolated glass style.

title: Astronomy Space Suite
views:
  - title: Overview
    path: overview
    icon: mdi:telescope
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Mission control
            icon: mdi:view-dashboard
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.astronomy_space_suite_neo_count_today
                name: NEOs today
                color: deep-orange
              - type: tile
                entity: sensor.astronomy_space_suite_planetary_kp_index
                name: Planetary KP
                color: purple
              - type: tile
                entity: sensor.astronomy_space_suite_coronal_mass_ejections
                name: CMEs
                color: amber
              - type: tile
                entity: sensor.astronomy_space_suite_solar_flares
                name: Solar flares
                color: red
          - type: custom:apod-card
            entity: sensor.astronomy_space_suite_apod
            title: Astronomy Picture of the Day
            show_explanation: true
            show_copyright: true
            show_hd_link: true
            show_date: true
            image_height: 420

      - type: grid
        cards:
          - type: heading
            heading: Tonight
            icon: mdi:weather-night
          - type: custom:night-sky-highlights-card
            title: Planetary highlights
            telescope_mode: false
          - type: custom:night-sky-highlights-2-card
            title: Astronomy highlights
          - type: custom:dso-tonight-table-card
            title: Deep sky tonight
            entity: sensor.nasa_astronomy_deepsky_best_tonight
            show_magnitude: true
            sort_by: score
            max_magnitude: 10

      - type: grid
        cards:
          - type: heading
            heading: Live environment
            icon: mdi:earth
          - type: custom:earth-observation-card
            title: Earth and Sun observation
            epic_entity: camera.astronomy_space_suite_epic_earth
            goes_entity: camera.astronomy_space_suite_goes_16_earth
            goes18_entity: camera.astronomy_space_suite_goes_18_earth
            himawari_entity: camera.astronomy_space_suite_himawari_8_earth
            meteosat_entity: camera.astronomy_space_suite_meteosat_12_earth
            sdo_entity: camera.astronomy_space_suite_sdo_sun
            soho_entity: camera.astronomy_space_suite_soho_sun
            refresh_interval: 5
          - type: custom:solar-activity-card
            title: Solar activity
            cme_entity: sensor.astronomy_space_suite_coronal_mass_ejections
            flare_entity: sensor.astronomy_space_suite_solar_flares
            storm_entity: sensor.astronomy_space_suite_geomagnetic_storms
            kp_entity: sensor.astronomy_space_suite_planetary_kp_index
            sdo_entity: camera.astronomy_space_suite_sdo_sun
            soho_entity: camera.astronomy_space_suite_soho_sun
            show_cme: true
            show_flares: true
            show_storms: true
            show_kp_gauge: true
            show_live_sun: true
            show_sdo: true
            show_soho: true
            time_range: 30

      - type: grid
        cards:
          - type: heading
            heading: Missions
            icon: mdi:rocket-launch
          - type: custom:iss-tracker-card
            entity: sensor.astronomy_space_suite_iss_position
            title: International Space Station
            show_map: true
            show_trail: true
            show_stream_button: true
            map_zoom: 0
            trail_hours: 6
            glass_mode: false
          - type: custom:rocket-launch-card
            entity_prefix: sensor.astronomy_space_suite_rocket_launch
            max_launches: 5
            title: Upcoming launches
            show_countdown: true
            show_weather: true
            show_tags: true

  - title: Observing
    path: observing
    icon: mdi:star-four-points
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Sky orientation
            icon: mdi:compass-outline
          - type: custom:dso-yard-map-card
            title: Sky Map
            show_house_map: false
            map_style: dark
          - type: custom:dso-panorama-card
            title: Horizon Panorama
          - type: custom:dso-dome-card
            title: 3D Sky Dome

      - type: grid
        cards:
          - type: heading
            heading: Observing plan
            icon: mdi:telescope
          - type: "custom:dso-tonight-table-card"
            title: Deep sky targets
            entity: sensor.nasa_astronomy_deepsky_best_tonight
            show_magnitude: true
            sort_by: altitude
            max_magnitude: 10
          - type: custom:night-sky-highlights-card
            title: Telescope targets
            telescope_mode: true
          - type: custom:night-sky-highlights-2-card
            title: Conditions and highlights

      - type: grid
        cards:
          - type: heading
            heading: Sun and Moon
            icon: mdi:theme-light-dark
          - type: custom:astro-horizon-card
            sun_entity: sun.sun
            title: Sun horizon
            show_elevation: true
            show_azimuth: true
            show_times: true
          - type: custom:astro-lunar-card
            moon_entity: sensor.moon_phase
            title: Lunar phase
            show_next_phases: true
            show_illumination: true
          - type: entities
            title: Sky conditions
            show_header_toggle: false
            entities:
              - sensor.nasa_astronomy_ephemeris_sky_twilight_phase
              - sensor.nasa_astronomy_ephemeris_sky_is_astronomical_night
              - sensor.nasa_astronomy_ephemeris_sky_is_sun_above_horizon
              - sensor.nasa_astronomy_ephemeris_sky_is_moon_above_horizon
              - sensor.nasa_astronomy_ephemeris_sky_day_length_hours
              - sensor.nasa_astronomy_ephemeris_sky_night_length_hours
              - sensor.nasa_astronomy_ephemeris_sky_local_sidereal_time_hours
              - sensor.nasa_astronomy_ephemeris_sky_julian_date
              - sensor.nasa_astronomy_ephemeris_sky_equation_of_time_minutes

