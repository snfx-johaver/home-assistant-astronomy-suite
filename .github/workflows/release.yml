name: Auto Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# One release at a time. Every step below is a read-modify-write of shared
# remote state: `bump_version.py` reads `version.json` and writes the successor,
# then the push step runs `git commit --amend`, `git tag -f` and
# `git push --tags --force`. None of that is atomic, and the force flags mean a
# loser does not fail -- it silently overwrites.
#
# Two pushes to `main` in quick succession is the ordinary case, not a rare one:
# merging two PRs back to back is enough. Both runs read the same
# `version.json`, both compute the same successor, and both force-push that one
# tag. The tag ends up on whichever commit finished last, so a published release
# can point at a tree that never contained the change its notes describe --
# and nothing anywhere reports an error.
#
# `cancel-in-progress: false` is the load-bearing half. Cancelling would abort a
# run that may already have pushed its tag but not yet created its release,
# leaving a tag with no release behind it. Queue instead: the second run then
# re-reads `version.json` *after* the first has written it, and computes the
# next version rather than colliding on the same one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version bump from commits
        id: bump
        run: python scripts/release_decision.py

      - name: Bump version
        if: steps.bump.outputs.skip != 'true'
        id: version
        run: |
          python scripts/bump_version.py ${{ steps.bump.outputs.bump }}

          # Read new version
          NEW_VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push version bump
        if: steps.bump.outputs.skip != 'true'
        run: |
          git add -A
          git commit --amend -m "release: v${{ steps.version.outputs.version }} [skip ci]"
          git tag -f "v${{ steps.version.outputs.version }}"
          git push --force-with-lease
          git push --tags --force

      - name: Create GitHub Release
        if: steps.bump.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## What's Changed

            ${{ steps.bump.outputs.changelog }}

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.bump.outputs.previous_tag }}...${{ steps.version.outputs.tag }}
          generate_release_notes: false
