  - title: Space Weather
    path: space-weather
    icon: mdi:weather-sunny-alert
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Solar activity monitor
            icon: mdi:weather-sunny-alert
          - type: custom:solar-activity-card
            cme_entity: sensor.astronomy_space_suite_coronal_mass_ejections
            flare_entity: sensor.astronomy_space_suite_solar_flares
            storm_entity: sensor.astronomy_space_suite_geomagnetic_storms
            kp_entity: sensor.astronomy_space_suite_planetary_kp_index
            sdo_entity: camera.astronomy_space_suite_sdo_sun
            soho_entity: camera.astronomy_space_suite_soho_sun
            title: Solar Activity Monitor
            show_cme: true
            show_flares: true
            show_storms: true
            show_kp_gauge: true
            show_live_sun: true
            show_sdo: true
            show_soho: true
            time_range: 30
          - type: entities
            title: Space weather feeds
            show_header_toggle: false
            entities:
              - sensor.astronomy_space_suite_planetary_kp_index
              - sensor.astronomy_space_suite_coronal_mass_ejections
              - sensor.astronomy_space_suite_solar_flares
              - sensor.astronomy_space_suite_geomagnetic_storms

      - type: grid
        cards:
          - type: heading
            heading: Live Sun
            icon: mdi:white-balance-sunny
          - type: picture-entity
            entity: camera.astronomy_space_suite_sdo_sun
            name: SDO 171 Angstrom
            show_state: false
            camera_view: auto
          - type: picture-entity
            entity: camera.astronomy_space_suite_soho_sun
            name: SOHO LASCO C3
            show_state: false
            camera_view: auto

